<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taller GRAPHQL</title>
  <style>
    .centros-list, .tips-list {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      max-height: 200px;
      overflow-y: auto;
    }
    .centro-item, .tip-item {
      padding: 5px;
      margin: 2px 0;
      background: #f5f5f5;
      border-radius: 3px;
    }
    .buttons-container {
      margin: 10px 0;
    }
    .buttons-container button {
      margin: 0 5px;
    }
  </style>
</head>
<body>
  <h1>RENDIMIENTO COMBUSTIBLE</h1>

  <!-- login-->
  <div id="login-section">
    <h2>Iniciar sesión</h2>
    <input type="email" id="email" placeholder="Correo electronico" /><br />
    <input type="password" id="password" placeholder="Contraseña" /><br />
    <button id="loginBtn">Login</button>
    <p id="login-status"></p>
  </div>

  <!-- vehiculos-->
  <div id="vehicles-section" style="display:none;">
    <h2>Vehículos registrados</h2>
    <select id="vehicleSelect">
      <option value="">-- Selecciona un vehiculo --</option>
    </select>
    <p id="vehicleInfo"></p>

    <h3>Calcular Rendimiento</h3>
    <input type="number" id="num1" placeholder="Distancia Recorrida" /><br />
    <input type="number" id="num2" placeholder="Galones Consumidos" /><br />
    <br />

    <div class="buttons-container">
      <button id="calculateBtn">Calcular</button>
      <button id="doSomethingBtn">Mostrar Centros de Operacion</button>
      <button id="tipsBtn">Ver Tips Conduccion</button>
    </div>

    <!-- Container para mostrar los centros de op -->
    <div id="centrosContainer" style="display:none; margin-top: 20px;">
      <h3>Centros de Operacion creados</h3>
      <div id="centrosList" class="centros-list"></div>
    </div>

    <!-- mostrar los tips de conduccion del mock propio -->
    <div id="tipsContainer" style="display:none; margin-top: 20px;">
      <h3>Tips para Mejorar el Rendimiento de Combustible</h3>
      <div id="tipsList" class="tips-list"></div>
    </div>

    <p id="calcResult"></p>
  </div>

  <script>
    const API_URL = "http://localhost:4001/graphql";
    let userToken = "";
    let vehicles = [];
    let centrosOperacion = [];
    let tipsConduccion = [];

    // LOGICA LOGIN
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const query = `
        mutation AuthUser($authInput: AuthInput!) {
          authUser(authInput: $authInput) {
            token
          }
        }
      `;

      const variables = { authInput: { email, password } };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, variables }),
        });

        const result = await response.json();

        if (result.data?.authUser?.token) {
          userToken = result.data.authUser.token;
          document.getElementById("login-status").innerText = "✅ Login exitoso";
          document.getElementById("login-section").style.display = "none";
          document.getElementById("vehicles-section").style.display = "block";
          loadVehicles();
        } else {
          document.getElementById("login-status").innerText = "❌ Credenciales incorrectas";
        }
      } catch (error) {
        console.error(error);
        document.getElementById("login-status").innerText = "Error de conexion";
      }
    });

    // CARGAR VEHICULOS DEL QUERY
    async function loadVehicles() {
      const query = `
        query {
          getVehicleInMongo {
            placa
            tipoVehiculo
            rendimientoTeorico
            CentroOperacion {
              _id
              nombre
            }
          }
        }
      `;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: userToken ? `Bearer ${userToken}` : "",
          },
          body: JSON.stringify({ query }),
        });

        const result = await response.json();
        vehicles = result.data?.getVehicleInMongo || [];
        const select = document.getElementById("vehicleSelect");

        select.innerHTML = '<option value="">-- Selecciona un vehiculo --</option>';
        vehicles.forEach((v, index) => {
          const opt = document.createElement("option");
          opt.value = index;
          opt.textContent = `${v.placa} (${v.tipoVehiculo}) (${v.CentroOperacion?.nombre || 'Sin centro de op'})`;
          select.appendChild(opt);
        });

        select.addEventListener("change", showVehicleInfo);
      } catch (error) {
        console.error(error);
      }
    }

    // MOSTRAR INFO DE VEHICULO
    function showVehicleInfo() {
      const index = document.getElementById("vehicleSelect").value;
      if (index === "") {
        document.getElementById("vehicleInfo").innerText = "";
        return;
      }
      const v = vehicles[index];
      
      let info = `Placa: ${v.placa}\n`;
      info += `Tipo de vehiculo: ${v.tipoVehiculo}\n`;
      info += `Rendimiento teorico: ${v.rendimientoTeorico}\n`;
      
      if (v.CentroOperacion && v.CentroOperacion.nombre) {
        info += `Centro de Operacion: ${v.CentroOperacion.nombre}`;
      } else if (v.CentroOperacion) {
        info += `Centro de Operacion ID: ${v.CentroOperacion}`;
      } else {
        info += `Centro de Operacion: No asignado`;
      }
      
      document.getElementById("vehicleInfo").innerText = info;
    }

    // CALCULAR RENDIMIENTO DEL VEH
    document.getElementById("calculateBtn").addEventListener("click", () => {
      const index = document.getElementById("vehicleSelect").value;
      if (index === "") {
        alert("Selecciona un vehiculo primero");
        return;
      }

      const v = vehicles[index];
      const num1 = parseFloat(document.getElementById("num1").value) || 0;
      const num2 = parseFloat(document.getElementById("num2").value) || 0;
      const total = num1 / num2;
      const eficiencia = total / (v.rendimientoTeorico || 1) * 100;
      document.getElementById("calcResult").innerText = 
        `Rendimiento: ${total.toFixed(2)}\nEficiencia: ${eficiencia.toFixed(2)}%`;
    });

    // MOSTRAR CENTROS DE OPERACION
    document.getElementById("doSomethingBtn").addEventListener("click", async () => {
      await loadCentrosOperacion();
    });

    // MOSTRAR TIPS DE CONDUCCION (NO FUNCIONANDO, ERROR EN EL QUERY)
    document.getElementById("tipsBtn").addEventListener("click", async () => {
      await loadTipsConduccion();
    });

    // CARGAR CENTROS DE OPERACION
    async function loadCentrosOperacion() {
      const query = `
        query {
          getCenOpInMongo {
            _id
            nombre
          }
        }
      `;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: userToken ? `Bearer ${userToken}` : "",
          },
          body: JSON.stringify({ query }),
        });

        const result = await response.json();
        
        if (result.data?.getCenOpInMongo) {
          centrosOperacion = result.data.getCenOpInMongo;
          mostrarCentros();
        } else if (result.errors) {
          console.error("Error en GraphQL:", result.errors);
          alert("Error al cargar centros de operacion: " + result.errors[0].message);
        }
      } catch (error) {
        console.error("Error de conexion:", error);
        alert("Error de conexion al cargar centros de op");
      }
    }

    //  CARGAR TIPS DE CONDUCCION
    async function loadTipsConduccion() {
      const query = `
        query {
          getPosts {
            id
            titulo
            decripcion
          }
        }
      `;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: userToken ? `Bearer ${userToken}` : "",
          },
          body: JSON.stringify({ query }),
        });

        const result = await response.json();
        console.log("Resultado de tips:", result);
        
        if (result.data?.getPosts) {
          tipsConduccion = result.data.getPosts;
          mostrarTips();
        } else if (result.errors) {
          console.error("Error en GraphQL:", result.errors);
          
          
        }
      } catch (error) {
        console.error("Error de conexión:", error);
        
        
      }
    }

    // MOSTRAR LOS COPS EN EL HTML
    function mostrarCentros() {
      const container = document.getElementById("centrosContainer");
      const list = document.getElementById("centrosList");
      
      // Ocultar tips si estan visibles
      document.getElementById("tipsContainer").style.display = "none";
      
      if (centrosOperacion.length === 0) {
        list.innerHTML = "<p>No hay centros de operacion creados</p>";
      } else {
        list.innerHTML = centrosOperacion.map(centro => `
          <div class="centro-item">
            <strong>${centro.nombre}</strong>
            <br>ID: ${centro._id}
          </div>
        `).join('');
      }
      
      // Mostrar el container
      container.style.display = "block";
    }

    // MOSTRAR LOS TIPS EN EL HTML
    function mostrarTips() {
      const container = document.getElementById("tipsContainer");
      const list = document.getElementById("tipsList");
      
      // Ocultar cops si estan visibles
      document.getElementById("centrosContainer").style.display = "none";
      
      if (tipsConduccion.length === 0) {
        list.innerHTML = "<p>No hay tips de conduccion disponibles</p>";
      } else {
        list.innerHTML = tipsConduccion.map(tip => `
          <div class="tip-item">
            <strong>${tip.titulo}</strong>
            ${tip.decripcion ? `<br>${tip.decripcion}` : ''}
          </div>
        `).join('');
      }
      
      // Mostrar el contenedor
      container.style.display = "block";
    }

    
  </script>
</body>
</html>
