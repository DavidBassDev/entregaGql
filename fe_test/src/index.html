<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login + Vehículos + Cálculo</title>
</head>
<body>
  <h1>Autenticación y Vehículos</h1>

  <!-- Sección de login -->
  <div id="login-section">
    <h2>Iniciar sesión</h2>
    <input type="email" id="email" placeholder="Correo electrónico" /><br />
    <input type="password" id="password" placeholder="Contraseña" /><br />
    <button id="loginBtn">Login</button>
    <p id="login-status"></p>
  </div>

  <!-- Sección de vehículos -->
  <div id="vehicles-section" style="display:none;">
    <h2>Vehículos registrados</h2>
    <select id="vehicleSelect">
      <option value="">-- Selecciona un vehículo --</option>
    </select>
    <p id="vehicleInfo"></p>

    <h3>Operación con números</h3>
    <input type="number" id="num1" placeholder="Número 1" /><br />
    <input type="number" id="num2" placeholder="Número 2" /><br />
    <br />

    <button id="calculateBtn">Calcular</button>
    <button id="doSomethingBtn">Hacer algo</button>

    <p id="calcResult"></p>
  </div>

  <script>
    const API_URL = "http://localhost:4001/graphql";
    let userToken = "";
    let vehicles = [];

    // LOGIN
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const query = `
        mutation AuthUser($authInput: AuthInput!) {
          authUser(authInput: $authInput) {
            token
          }
        }
      `;

      const variables = { authInput: { email, password } };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, variables }),
        });

        const result = await response.json();

        if (result.data?.authUser?.token) {
          userToken = result.data.authUser.token;
          document.getElementById("login-status").innerText = "✅ Login exitoso";
          document.getElementById("login-section").style.display = "none";
          document.getElementById("vehicles-section").style.display = "block";
          loadVehicles();
        } else {
          document.getElementById("login-status").innerText = "❌ Credenciales incorrectas";
        }
      } catch (error) {
        console.error(error);
        document.getElementById("login-status").innerText = "Error de conexión";
      }
    });

    // CARGAR VEHÍCULOS
    async function loadVehicles() {
      const query = `
        query {
          getVehicleInMongo {
            placa
            tipoVehiculo
            rendimientoTeorico
             CentroOperacion {
            _id
            nombre
          }
          }
        }
      `;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: userToken ? `Bearer ${userToken}` : "",
          },
          body: JSON.stringify({ query }),
        });

        const result = await response.json();
        vehicles = result.data?.getVehicleInMongo || [];
        const select = document.getElementById("vehicleSelect");

        select.innerHTML = '<option value="">-- Selecciona un vehículo --</option>';
        vehicles.forEach((v, index) => {
          const opt = document.createElement("option");
          opt.value = index;
          opt.textContent = `${v.placa} (${v.tipoVehiculo}) (${v.CentroOperacion.nombre})`;
          select.appendChild(opt);
        });

        select.addEventListener("change", showVehicleInfo);
      } catch (error) {
        console.error(error);
      }
    }

    // MOSTRAR INFO DE VEHÍCULO
    // MOSTRAR INFO DE VEHÍCULO
function showVehicleInfo() {
  const index = document.getElementById("vehicleSelect").value;
  if (index === "") {
    document.getElementById("vehicleInfo").innerText = "";
    return;
  }
  const v = vehicles[index];
  
  let info = `Placa: ${v.placa}\n`;
  info += `Tipo de vehículo: ${v.tipoVehiculo}\n`;
  info += `Rendimiento teórico: ${v.rendimientoTeorico}\n`;
  
  // Verificar si existe el centro de operación y mostrar sus datos
  if (v.CentroOperacion && v.CentroOperacion.nombre) {
    info += `Centro de Operación: ${v.CentroOperacion.nombre}`;
  } else if (v.CentroOperacion) {
    // Si solo tienes el ID pero no los datos poblados
    info += `Centro de Operación ID: ${v.CentroOperacion}`;
  } else {
    info += `Centro de Operación: No asignado`;
  }
  
  document.getElementById("vehicleInfo").innerText = info;
}

    // CALCULAR SUMA
    document.getElementById("calculateBtn").addEventListener("click", () => {
      const index = document.getElementById("vehicleSelect").value;
      if (index === "") {
        alert("Selecciona un vehículo primero");
        return;
      }

      const v = vehicles[index];
      const num1 = parseFloat(document.getElementById("num1").value) || 0;
      const num2 = parseFloat(document.getElementById("num2").value) || 0;
      const total = num1 + num2 + (v.rendimientoTeorico || 0);

      document.getElementById("calcResult").innerText = 
        `Resultado: ${total}`;
    });

    // BOTÓN EXTRA
    document.getElementById("doSomethingBtn").addEventListener("click", () => {
      alert("¡Hiciste algo!");
    });
  </script>
</body>
</html>
